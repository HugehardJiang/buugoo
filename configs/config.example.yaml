# Buugoo（布谷）配置文件
#
# 所有配置项都可以用环境变量覆盖：前缀 BUUGOO_，层级之间用双下划线。
# 例如 BUUGOO_LLM__CHAT__API_KEY=sk-xxx 会覆盖 llm.chat.api_key。
# 请不要把填写了密钥的配置文件提交到任何代码仓库。

# 部署模式：single（自部署，单用户，无需注册）| multi（多用户，注册登录）
mode: {{MODE}}

# 数据目录（SQLite 数据库、备份等）
data_dir: "{{DATA_DIR}}"

# 时区：影响每日用量统计、定时任务和对话中的"现在几点"
timezone: Asia/Shanghai

server:
  # 监听地址。只在本机使用请保持 127.0.0.1；对外提供服务时改为 0.0.0.0:8080 并务必设置访问密码。
  listen: "{{LISTEN}}"
  # 对外访问地址（反向代理后的域名），仅用于打印提示，可留空
  base_url: ""
  # 允许跨域访问的来源（同域部署无需填写）
  cors_origins: []

auth:
  # single 模式的访问密码，留空表示无需密码
  access_password: ""
  # JWT 签名密钥，buugoo init 会自动生成随机值；multi 模式必须设置（至少 32 字符）
  jwt_secret: "{{JWT_SECRET}}"
  # 登录有效期
  token_ttl: 720h
  # multi 模式的注册方式：open（开放注册）| invite（邀请码注册）| closed（关闭注册）
  registration: invite

# 多用户版未登录时的介绍主页（单用户版不显示），留空使用内置的文字；也可以在管理后台「账号与安全」里改
home:
  title: ""     # 默认「<名字>，一个真的记得你的 AI 朋友」
  tagline: ""   # 标题下面的一句介绍

admin:
  # 网页管理后台（设置 → 管理后台）的密码。默认 1228，所有人都知道，请务必改掉。
  # 只能在这里或环境变量 BUUGOO_ADMIN__PASSWORD 中修改；网页上保存的设置写在 <data_dir>/settings.yaml，
  # 重启服务后生效（sudo systemctl restart buugoo）。
  password: "1228"

security:
  # 加密数据库中保存的模型 API Key（在网页里添加的模型），buugoo init 会自动生成。
  # 丢失后已保存的 Key 无法解密，需要在网页里重新填写。
  encryption_key: "{{ENC_KEY}}"
  # multi 模式下，普通用户自己添加的模型默认只能连接公网地址（防止借此探测服务器内网）。
  # 只有用户都可信、需要连接局域网模型（如 Ollama）时才改为 true。管理员不受此限制。
  allow_private_model_urls: false

database:
  # sqlite（默认，零配置）| mysql
  driver: sqlite
  # sqlite：数据库文件路径，留空则使用 <data_dir>/buugoo.db
  # mysql：例如 buugoo:密码@tcp(127.0.0.1:3306)/buugoo?charset=utf8mb4&parseTime=True&loc=Local
  #        建议用环境变量 BUUGOO_DATABASE__DSN 传入，避免密码写在文件里
  dsn: ""
  max_open_conns: 10
  max_idle_conns: 5

# 模型也可以在网页的「设置 → 模型」中添加和切换（推荐）。这里配置的是默认模型，
# 网页中没有添加任何模型时使用；网页中配置了向量模型后，以网页中的为准。
llm:
  # 聊天模型（OpenAI 兼容协议，可接 DeepSeek、通义千问、OpenAI 等）
  chat:
    provider: openai
    base_url: https://api.deepseek.com/v1
    api_key: ""          # 必填，或使用环境变量 BUUGOO_LLM__CHAT__API_KEY
    model: deepseek-flash  # 或 deepseek-v4-pro
    temperature: 0.8       # 开启思考时不生效
    max_tokens: 1024
    timeout: 120s
    # 思考参数格式：none（不支持）| deepseek（thinking.type + reasoning_effort）|
    # reasoning_effort（OpenAI 风格）| enable_thinking（通义千问、硅基流动风格）|
    # model_switch（开启思考时换用 thinking_model 指定的推理模型）
    thinking_style: deepseek
    thinking_model: ""
    # 模型能否理解图片。不能看图的模型收到图片时，会先用一个能看图的模型把图片转述成文字。
    vision: true
    # 上下文长度（token），0 表示自动识别（服务商接口 → 常见模型表 → 64000）
    context_tokens: 0
  # 后台任务模型（记忆提取与打分），留空的字段沿用 chat 的配置，可换成更便宜的模型
  utility:
    provider: ""
    base_url: ""
    api_key: ""
    model: ""
    temperature: 0.2
    max_tokens: 1024
  # 向量模型（OpenAI 兼容协议）
  # 默认：硅基流动 BAAI/bge-m3（1024 维）
  # 可选：阿里云百炼 text-embedding-v3
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   model: text-embedding-v3
  #   dim: 1024
  # 更换向量模型后请执行 buugoo reembed 重新计算全部记忆的向量。
  embedding:
    provider: openai
    base_url: https://api.siliconflow.cn/v1
    api_key: ""          # 必填，或使用环境变量 BUUGOO_LLM__EMBEDDING__API_KEY
    model: BAAI/bge-m3
    dim: 0               # 0 表示使用模型默认维度
    batch_size: 32
    timeout: 60s

uploads:
  # 聊天中上传的图片与文档。留空存放在 <data_dir>/uploads，请与数据库一起备份。
  dir: ""
  max_file_mb: 20        # 单个文件上限
  max_files: 8           # 一条消息最多附带的文件数
  user_quota_mb: 500     # 每个用户的上传总量上限，0 不限
  doc_chars: 20000       # 一个文档最多放进对话的字数，超出部分截断

emotion:
  # 情绪系统：布谷对每个用户各有一份情绪（开心、难过、生气、担心、惊讶、不耐烦、想念）、心境与亲近程度。
  # 以下系数以 1 为标准（0-3），越大越明显。
  enabled: true
  expressiveness: 1.0    # 情绪起伏的整体幅度
  temper: 1.0            # 易怒程度
  patience: 1.0          # 耐心，越大越不容易不耐烦
  forgiveness: 1.0       # 消气速度
  empathy: 1.0           # 被对方情绪感染的程度

tools:
  # 聊天中模型可以自己决定联网搜索、读取网页，以及编写并运行 Python 代码来做精确计算。
  search:
    # auto：优先用 DeepSeek 的搜索（填了 deepseek_api_key 就用它，没填时只有当前模型是 DeepSeek 才用该模型的 Key），
    #       用不了时用下面填了 Key 的博查或 Tavily
    # deepseek / bocha / tavily：只用指定的服务；off：关闭
    provider: auto
    deepseek_api_key: ""   # 专门给搜索和读网页用的 DeepSeek Key（platform.deepseek.com），填了以后用其他模型聊天也能用 DeepSeek 搜索
    bocha_api_key: ""      # 博查（open.bochaai.com），国内服务器推荐；建议用环境变量 BUUGOO_TOOLS__SEARCH__BOCHA_API_KEY
    tavily_api_key: ""     # Tavily（app.tavily.com），每月有免费额度，也能读取网页正文
    # 搜索服务不能读网页时（如博查），由服务器直接下载网页正文（只能访问公网地址）
    direct_fetch: true
  python:
    # docker：在一次性容器中运行（断网、只读、限制内存/CPU/时间），所有用户可用。需要服务能使用 docker 命令，
    #         注意：把服务用户加入 docker 组等同于给它 root 权限。
    # local ：直接用本机 python3 运行，只限制时间和内存，代码能访问网络和部分文件；multi 模式下只有管理员可用。
    # off   ：关闭
    runner: docker
    image: python:3.12-slim
    docker: docker
    python: python3
    timeout: 30s
    memory_mb: 256
    # 预装的第三方库（启动时在后台安装，已经装好的不会重复安装）
    packages: [numpy, scipy, sympy, pandas, mpmath, matplotlib]
    # 允许布谷按需安装 PyPI 上的库：只装预编译包（不运行安装脚本），只有安装时联网，运行代码时仍然断网。
    # multi 模式下只有管理员的对话可以安装。装好的库所有人共用。
    allow_install: true
    index_url: ""          # 国内服务器建议 https://pypi.tuna.tsinghua.edu.cn/simple
    lib_dir: ""            # 留空为 <data_dir>/pylib
    lib_max_mb: 2048       # 库目录大小上限，超过后不再安装
    install_timeout: 5m
    # 每段对话的工作目录：代码能读取这段对话里上传的文件（input/，只读），保存在当前目录的文件之后的运行还在。
    # 计入用户的文件空间，删除对话时一起删除；0 表示不保留文件。
    workspace_dir: ""      # 留空为 <data_dir>/workspaces
    workspace_mb: 50       # 每段对话工作目录（压缩后）的上限

proactive:
  # 提醒与定时任务：「半小时后叫我」是提醒，到时间主动发消息；「每天早上 8 点搜一下新闻发我」是定时任务，
  # 到时间布谷会去做（可以搜索、运行代码）再把结果发过来
  reminders: true
  # 主动关心：很久没聊、或用户之前提到的事可能有结果时，布谷会主动问候（每个用户可以在设置里关掉）
  care: true
  quiet_start: "23:00"     # 免打扰时段（本地时间），这段时间不主动关心；提醒照常
  quiet_end: "08:00"
  idle_hours: 20           # 用户多久没说话后才考虑主动关心
  min_gap_hours: 20        # 两次主动关心至少间隔
  check_interval: 30m

channels:
  # 聊天软件接入：只处理私聊。微信由每个用户在网页「聊天软件」页扫码连接自己的微信；
  # QQ、Telegram 由用户生成绑定码，在聊天软件里发给布谷即可绑定，
  # 绑定后和网页共用同一份记忆、心情与对话。修改后需要重启服务。
  dir: ""                  # 微信登录态等，留空为 <data_dir>/channels
  weixin:
    # 个人微信（微信官方 ClawBot 接口）：开启后每个用户在「聊天软件」页扫码连接自己的微信。
    # 需要手机微信最新版（iOS ≥ 8.0.70、安卓 ≥ 8.0.69）并有 ClawBot 插件。
    enabled: false
  qq:
    # QQ：用一个 QQ 小号登录 NapCat，在 NapCat 中添加「WebSocket 客户端」，
    # 地址填 ws://127.0.0.1:8080/onebot/v11/ws，Token 填下面的 access_token。非官方协议，有封号风险。
    enabled: false
    access_token: ""       # 至少 8 位
    auto_accept_friend: true
  telegram:
    enabled: false
    bot_token: ""          # 在 @BotFather 创建机器人获得
    proxy: ""              # 国内服务器需要，例如 http://127.0.0.1:7890
    api_base: ""           # 留空为 https://api.telegram.org

memory:
  # 检索打分：score = alpha·recency + beta·importance + gamma·relevance
  #   recency    = decay ^ 距上次访问的小时数
  #   importance = 重要性 / 10
  #   relevance  = 与当前话题的余弦相似度
  retrieval:
    alpha: 1.0
    beta: 1.0
    gamma: 1.5
    decay: 0.995
    candidate_k: 100     # 先按相似度取出的候选数量
    top_k: 8             # 最终放进提示词的记忆数量
    min_relevance: 0.3   # 相似度低于该值的记忆不使用
  write:
    enabled: true
    importance_threshold: 4  # 重要性低于该值（1-10）的内容不记
    access_boost: 0.2        # 记忆每被使用一次增加的强度
    dedup_similarity: 0.95   # 与已有记忆相似度高于该值视为重复，不再写入
    workers: 2
    queue_size: 256
  # 记忆压缩：一个人的记忆超过 max_memories 条时自动整理，把相近的合并、旧的零碎记忆概括成几条，
  # 压到上限的七成左右（用 utility 模型，消耗计入该用户的每日用量）。0 表示不自动压缩，设置页仍可手动「整理记忆」
  compact:
    max_memories: 300
    similarity: 0.8   # 相似度超过这个值的记忆当成相近的合并
  # 内存向量缓存（按用户缓存）
  cache:
    max_users: 1000
    max_bytes: 536870912
    ttl: 30m

chat:
  # 提示词的预算按模型的上下文长度（llm.chat.context_tokens）计算。
  # 长对话压缩：上下文快用满时，较早的消息由辅助模型整理成摘要，聊久了也记得前面说过什么
  summarize: true
  compact_at: 80   # 一轮用掉的上下文超过这个百分比时，下一条消息处理前先压缩
  keep_recent: 20  # 压缩后最近约这个百分比的消息保留原文

persona:
  # 人格档案文件，留空使用内置的"布谷"
  file: ""
  # 关掉的预设性格（用户在「设置 → 性格」中选），可选 gentle、snarky、strategist、bubbly、alive
  disabled_presets: []

# 每个用户的每日免费额度，0 表示不限制（官网部署建议设置，防止 API 费用失控）。
# 多用户版开通了时长套餐的用户按套餐额度；额度用完后按管理后台「运营 → 计费」里的价格扣余额。
quota:
  daily_messages: 0
  daily_tokens: 0
  daily_searches: 0      # 联网搜索次数，用完后只是不能搜索，聊天照常
  exempt_admins: true

scheduler:
  enabled: true
  # 每日记忆巩固（第二阶段实现），cron 表达式，按 timezone 解释
  consolidation_spec: "0 4 * * *"

update:
  # 启动时检查是否有新版本（只在日志中提示，不会自动更新）
  check_on_start: true
  repo: HugehardJiang/buugoo
  # 下载镜像地址，留空从 GitHub 下载；也可用环境变量 BUUGOO_MIRROR 指定
  mirror: ""

log:
  level: info    # debug | info | warn | error
  format: text   # text | json

debug:
  # 开放 /api/v1/debug/prompt 查看组装后的提示词（single 模式总是开放）
  prompt_endpoint: false
