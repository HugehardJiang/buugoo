<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>布谷</title>
    <style>
      /* 加载画面：网页脚本还没下载完时显示（直接写在页面里，不用等脚本）。水墨布谷鸟一笔一笔画出来，
         网速快的时候 0.35 秒内就加载完，这时什么也不显示，免得闪一下。 */
      html, body { margin: 0; background: #faf9f5; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0; animation: boot-show .5s ease .35s forwards; }
      .boot__inner { display: grid; justify-items: center; gap: 14px; }
      .boot svg { width: 168px; height: 91px; overflow: visible; }
      .boot__paint { transform-box: fill-box; transform-origin: left center; animation: boot-paint 1.3s cubic-bezier(.65, 0, .35, 1) .45s both; }
      .boot__dots circle { fill: #5b7a4a; opacity: .18; animation: boot-dot 1.5s ease-in-out 1.8s infinite; }
      .boot__dots circle:nth-child(2) { animation-delay: 1.98s; }
      .boot__dots circle:nth-child(3) { animation-delay: 2.16s; }
      .boot__name { margin: 0; color: #5e5d59; font: 400 15px/1 "Iowan Old Style", "Palatino Linotype", Georgia, "Noto Serif SC", "Songti SC", serif; letter-spacing: .5em; text-indent: .5em; opacity: 0; animation: boot-show .8s ease 1.2s forwards; }
      @keyframes boot-show { to { opacity: 1; } }
      @keyframes boot-paint { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes boot-dot { 0%, 100% { opacity: .18; } 35% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot__paint, .boot__name { animation: none; opacity: 1; } .boot__paint { transform: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="正在加载">
        <div class="boot__inner">
          <svg viewBox="0 0 96 52" aria-hidden="true">
            <defs>
              <mask id="boot-mask"><rect class="boot__paint" x="0" y="0" width="96" height="52" fill="#fff" /></mask>
            </defs>
            <g mask="url(#boot-mask)">
              <path d="M2 45.6 C 20 43.4, 46 44.6, 82 42 C 83.4 41.9, 83.6 42.6, 82.4 42.9 C 50 46.2, 22 46.8, 2.4 46.7 Z" fill="#141413" fill-opacity=".5" />
              <path d="M62 43.3 C 66 41.2, 70 38.9, 74.6 38.2" fill="none" stroke="#141413" stroke-opacity=".42" stroke-width="1" stroke-linecap="round" />
              <path d="M71.4 38.6 C 73.6 35.8, 77.4 35, 79.6 36 C 77.8 38.6, 74.6 39.6, 71.4 38.6 Z" fill="#5b7a4a" fill-opacity=".8" />
              <path d="M66.4 41 C 67 38.2, 69.2 36.4, 71.4 36.2 C 71 38.6, 69 40.4, 66.4 41 Z" fill="#5b7a4a" fill-opacity=".5" />
              <path d="M42.2 38.2 L 41.3 43.8 M 46.8 37.2 L 47.2 43.4" fill="none" stroke="#141413" stroke-width="1.1" stroke-linecap="round" />
              <path d="M66 15.6 L 60.6 13.6 C 59.6 10.6, 56.8 8.9, 53.6 9.1 C 50.2 9.3, 47.6 11.6, 46.8 14.8 C 44.5 16.6, 40 18.4, 35.2 21.4 C 30.6 24.4, 26.8 28, 24 31.4 L 6 40.6 L 7.4 42.2 L 26.6 35.2 C 30.4 37.8, 36 39.2, 41.4 38.6 C 48.6 37.8, 54.6 33, 57.2 26.4 C 58.6 22.6, 59.4 19.6, 60.4 17.6 Z" fill="#141413" fill-opacity=".9" />
              <g fill="none" stroke="#faf9f5" stroke-width=".9" stroke-linecap="round">
                <path d="M33 25.6 C 38 26.8, 44.4 26.6, 50.4 23.2" stroke-opacity=".6" />
                <path d="M30.4 29 C 36 31, 42.6 30.8, 48 28" stroke-opacity=".42" />
                <path d="M24.4 33.2 L 10.6 40.2" stroke-opacity=".4" stroke-width=".7" />
                <path d="M45.8 34.4 l 2.6 -1.3 M 49.4 32.4 l 2.2 -1.3 M 52.4 29.9 l 1.8 -1.3" stroke-opacity=".3" stroke-width=".7" />
              </g>
              <circle cx="55.3" cy="13.5" r="1.05" fill="#faf9f5" />
            </g>
            <g class="boot__dots">
              <circle cx="76" cy="20" r="1.6" />
              <circle cx="82" cy="20" r="1.6" />
              <circle cx="88" cy="20" r="1.6" />
            </g>
          </svg>
          <p class="boot__name">布谷</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
