name: Release

on:
  push:
    tags: ["v*"]
  # 也可以在 Actions 页面手动发布：填写版本号，由工作流创建 tag 后发布。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号，例如 v0.1.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: 交叉编译并发布到 GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 创建 tag（手动发布时）
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+' || { echo "版本号无效：$TAG"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "布谷 $TAG"
          git push origin "$TAG"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: 构建并推送多架构 Docker 镜像
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      # 阿里云 ACR 为可选：配置了以下 secrets 才推送，否则跳过。
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}         # 例如 registry.cn-hangzhou.aliyuncs.com
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录阿里云 ACR（可选）
        if: env.ALIYUN_REGISTRY != '' && env.ALIYUN_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USERNAME }}
          password: ${{ env.ALIYUN_PASSWORD }}
      - name: 生成镜像名
        id: images
        run: |
          images="ghcr.io/hugehardjiang/buugoo"
          if [ -n "$ALIYUN_REGISTRY" ] && [ -n "$ALIYUN_USERNAME" ]; then
            images="$images
          ${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/buugoo"
          fi
          {
            echo "list<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
