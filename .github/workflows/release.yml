name: Release

on:
  push:
    tags: ["v*"]
  # 也可以在 Actions 页面手动发布：默认按 full 模式补全全平台与 Docker，也可按需勾选构建沙箱镜像。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号，例如 v0.47.0"
        required: true
      mode:
        description: "发布范围：linux（仅 systemd 快速版）或 full（全平台 + Docker）"
        type: choice
        options:
          - linux
          - full
        default: "full"
      build_sandbox:
        description: "同时构建并推送沙箱镜像（buugoo-sandbox）"
        type: boolean
        default: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: 交叉编译并发布到 GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 准备 tag（手动发布时）
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+' || { echo "版本号无效：$TAG"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG 已存在，切换到该 tag 补全发布产物"
            git checkout "$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "布谷 $TAG"
            git push origin "$TAG"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --config ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') && '.goreleaser.yaml' || '.goreleaser.linux.yaml' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: 构建并推送多架构 Docker 镜像
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      # 阿里云 ACR 为可选：配置了以下 secrets 才推送，否则跳过。
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}         # 例如 registry.cn-hangzhou.aliyuncs.com
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录阿里云 ACR（可选）
        if: env.ALIYUN_REGISTRY != '' && env.ALIYUN_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USERNAME }}
          password: ${{ env.ALIYUN_PASSWORD }}
      - name: 生成镜像名
        id: images
        run: |
          images="ghcr.io/hugehardjiang/buugoo"
          if [ -n "$ALIYUN_REGISTRY" ] && [ -n "$ALIYUN_USERNAME" ]; then
            images="$images
          ${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/buugoo"
          fi
          {
            echo "list<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}

  sandbox:
    name: 构建并推送沙箱镜像（buugoo-sandbox）
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.build_sandbox == true
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录阿里云 ACR（可选）
        if: env.ALIYUN_REGISTRY != '' && env.ALIYUN_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USERNAME }}
          password: ${{ env.ALIYUN_PASSWORD }}
      - name: 生成镜像名
        id: images
        run: |
          images="ghcr.io/hugehardjiang/buugoo-sandbox"
          if [ -n "$ALIYUN_REGISTRY" ] && [ -n "$ALIYUN_USERNAME" ]; then
            images="$images
          ${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/buugoo-sandbox"
          fi
          {
            echo "list<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
